<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Private Guest Control</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--wine:#721f3d;--wine-bright:#a83c62;--gold:#d6ad68;--ink:#09080a;--panel:#171216;--text:#fff8f4;--muted:#c8b8bd}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% -15%,#451526 0,#190d13 32%,#09080a 72%);color:var(--text)}
main{width:min(100%,430px);padding:20px;border:1px solid #b9768b38;border-radius:24px;background:linear-gradient(155deg,#21171d 0,#120e11 72%);box-shadow:0 24px 65px #000b,0 0 0 1px #0008 inset}
[hidden]{display:none!important}
.eyebrow{margin:0 0 7px;color:#d3a9b7;font-size:.66rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.preview-badge{float:right;margin-top:-2px;padding:4px 7px;border:1px solid #d6ad686b;border-radius:999px;background:#3b291b;color:#f0ce96;font-size:.59rem;font-weight:850;letter-spacing:.12em}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.65rem,8vw,2.1rem);font-weight:600;letter-spacing:-.035em}
.subtitle{margin:5px 0 12px;color:var(--muted);font-size:.9rem;line-height:1.35}
.status{min-height:42px;margin:0 0 8px;padding:10px 12px;display:flex;align-items:center;border:1px solid #ffffff0d;border-radius:11px;background:#080709a3;color:#e4bf80;font-size:.86rem;line-height:1.3;overflow-wrap:anywhere}
.edge-count{margin:0 0 12px;color:#cf9cac;font-size:.75rem;font-weight:700;text-align:center}
#pairing{margin-bottom:10px;padding:12px;border:1px solid #8f405b66;border-radius:12px;background:#250f17}
#pairing p{margin:0 0 8px;color:#e3ccd3;font-size:.84rem;line-height:1.35}
button{font:inherit;color:inherit}
#request-access{width:100%;padding:12px;border:1px solid #d09aaa66;border-radius:10px;background:#792846;font-weight:800;box-shadow:0 5px 13px #0007}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.control{--progress:0%;position:relative;isolation:isolate;min-height:91px;overflow:hidden;padding:14px 10px;border:1px solid #b7788c73;border-bottom-color:#3b1723;border-radius:15px;background:linear-gradient(165deg,#3b1a26,#24131a);box-shadow:0 7px 0 #10070b,0 11px 20px #0007,0 1px 0 #ffffff18 inset;text-align:center;touch-action:manipulation;transition:transform .1s ease,box-shadow .1s ease,border-color .15s ease,filter .15s ease}
.control::before{content:"";position:absolute;z-index:0;inset:0 auto 0 0;width:var(--progress);background:linear-gradient(90deg,#6d213e,#9d385e);opacity:.72;transition:width .09s linear}
.control .duration,.control .level{position:relative;z-index:1;display:block}
.control .duration{margin-bottom:6px;color:#d8bcc5;font-size:.68rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
.control .level{font-size:1.08rem;font-weight:850;letter-spacing:.055em}
.control.fixed:nth-child(2),.control.fixed:nth-child(4){background:linear-gradient(165deg,#4a1c2d,#2a141d)}
.control.hold{border-color:#c398607a;background:linear-gradient(165deg,#432b20,#251712);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.control.hold .level{font-size:1rem}
.control.hold .duration{margin:5px 0 0;color:#dabf95;font-size:.75rem}
.control .release{position:relative;z-index:1;display:block;margin-top:5px;color:#cdbb9e;font-size:.61rem;font-weight:650;letter-spacing:.035em}
.control:active:not(:disabled){transform:translateY(5px) scale(.985);box-shadow:0 2px 0 #10070b,0 5px 12px #0008,0 1px 0 #ffffff15 inset}
.control.active{border-color:#e7bd7c;background:linear-gradient(165deg,#8b2e51,#4c172a);box-shadow:0 5px 0 #16080d,0 0 24px #b8487166,0 0 0 1px #f1c88766 inset}
.control.hold.active{animation:hold-glow 1.15s ease-in-out infinite;background:linear-gradient(165deg,#764529,#452416)}
.control:focus-visible,#request-access:focus-visible{outline:3px solid #f6d59d;outline-offset:3px}
.control:disabled{cursor:not-allowed;filter:saturate(.35) brightness(.58);border-color:#55464b;box-shadow:0 5px 0 #0b0809,0 8px 16px #0006}
.privacy{display:block;margin-top:12px;color:#897a7f;font-size:.68rem;line-height:1.35;text-align:center}
body[data-control-state="locked"] .controls{opacity:.68}
body[data-control-state="locked"] .status{border-color:#a2415d;background:#2a111a;color:#ffc1d2}
body[data-control-state="unavailable"] .controls{opacity:.58}
@keyframes hold-glow{50%{border-color:#f1cd91;box-shadow:0 5px 0 #16080d,0 0 30px #d3845073,0 0 0 2px #f1c8877d inset}}
@media(max-height:720px){main{padding:16px}.control{min-height:78px;padding:10px}.status{min-height:36px;padding:8px 10px}.privacy{display:none}.subtitle{margin-bottom:9px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<span id="preview-badge" class="preview-badge" hidden>PREVIEW MODE</span>
<p id="guest-welcome" class="eyebrow">WELCOME, GUEST</p>
<h1>Are you a tease?</h1>
<p class="subtitle"><em>Mean or nice — the choice is yours.</em></p>
<p id="status" class="status" role="status" aria-live="polite">Opening private control session…</p>
<section id="pairing" hidden>
<p id="pairing-message"></p>
<button id="request-access">Request access</button>
</section>
<p id="edge-count" class="edge-count" aria-live="polite">EDGE used: 0 times</p>
<section class="controls" aria-label="Vibration controls">
<button class="control fixed" data-command="20" disabled><span class="duration">5 seconds</span><span class="level">LOW</span></button>
<button class="control fixed" data-command="40" disabled><span class="duration">5 seconds</span><span class="level">MED</span></button>
<button class="control fixed" data-command="60" disabled><span class="duration">5 seconds</span><span class="level">HIGH</span></button>
<button class="control fixed" data-command="70" disabled><span class="duration">5 seconds</span><span class="level">MAX</span></button>
<button id="random" class="control hold" data-command="random" disabled><span class="level">RANDOM</span><span class="duration">HOLD</span><span class="release">Release to stop</span></button>
<button id="max-hold" class="control hold" data-command="max-hold" disabled><span class="level">MAX</span><span class="duration">HOLD</span><span class="release">Release to stop</span></button>
</section>
<small class="privacy">Private invitation · control works only while your host is connected</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="controller.js"></script>
</body>
</html>
