<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chastity Vibrator</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17151d;color:#fff}
main{width:min(92vw,420px);box-sizing:border-box;padding:28px;border-radius:20px;background:#27232f;box-shadow:0 12px 40px #0006}
h1{font-size:1.35rem;margin:0 0 10px}
p{color:#c7c0d0;line-height:1.45}
.status{margin:18px 0;padding:12px;border-radius:10px;background:#191720;color:#ffca65;line-height:1.35;overflow-wrap:anywhere}
.edge-count{margin:12px 0;padding:12px;border-radius:10px;background:#1d1926;color:#ff9ca7;font-weight:700;text-align:center}
button{width:100%;padding:18px;margin:7px 0;border:0;border-radius:12px;font-size:1rem;font-weight:700;color:#fff;background:#7157d9}
button:disabled{opacity:.45}
small{display:block;margin-top:14px;color:#bdb7c9;line-height:1.4}

[hidden]{display:none!important}
.eyebrow{font-size:.7rem;letter-spacing:.18em;color:#b1a3d9;margin-bottom:12px}
h1{font-size:1.75rem;letter-spacing:-.04em}main{margin:24px 0;padding:26px;background:linear-gradient(150deg,#292532,#201d29);border:1px solid #ffffff0d}
button{position:relative;overflow:hidden;text-align:left;background:#3b324f;border:1px solid #ffffff0c;touch-action:manipulation;transition:background .15s,box-shadow .15s}
button:nth-of-type(2){background:#4d3b6a}button:nth-of-type(3){background:#5b427f}button:nth-of-type(4){background:#71529b}
button::after{content:"";position:absolute;bottom:0;left:0;height:3px;width:var(--progress,0%);background:#dcc7ff}
button.active{background:#8a62bf;box-shadow:0 0 0 2px #dcc7ff inset}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#random{margin-top:17px;text-align:center;border:1px solid #a385d4;background:#272031;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#random span{display:block;font-size:.75rem;font-weight:400;color:#cbbdde;margin-top:5px}
#random.active{animation:pulse 1.2s ease-in-out infinite}
.status{min-height:43px;display:flex;align-items:center}.edge-count{font-size:.85rem;background:transparent;padding:0;margin-bottom:18px}
@keyframes pulse{50%{box-shadow:0 0 0 3px #c09aea88 inset;background:#604279}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<div class="eyebrow">PRIVATE CONTROL</div>
<h1>Chastity Vibrator</h1>
<p>Choose a vibration level for the connected toy</p>
<p id="status" class="status" role="status" aria-live="polite">Opening private control session…</p>
<section id="pairing" hidden>
<p id="pairing-message"></p>
<button id="request-access">Request access</button>
</section>
<p id="edge-count" class="edge-count" aria-live="polite">EDGE used: 0 times</p>
<button data-command="20" disabled>5 seconds low</button>
<button data-command="40" disabled>5 seconds medium</button>
<button data-command="60" disabled>5 seconds high</button>
<button data-command="70" disabled>5 seconds max</button>
<button id="random" data-command="random" disabled>Hold for random<span>Release to stop</span></button>
<small>Your private invitation. Control is available only while your host has an active session. Keep this link to yourself.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="controller.js"></script>
</body>
</html>
