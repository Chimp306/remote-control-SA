<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lushcon Controller</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17151d;color:#fff}
main{width:min(92vw,420px);box-sizing:border-box;padding:28px;border-radius:20px;background:#27232f;box-shadow:0 12px 40px #0006}
h1{font-size:1.35rem;margin:0 0 10px}
p{color:#c7c0d0;line-height:1.45}
.status{margin:18px 0;padding:12px;border-radius:10px;background:#191720;color:#ffca65;line-height:1.35;overflow-wrap:anywhere}
.edge-count{margin:12px 0;padding:12px;border-radius:10px;background:#1d1926;color:#ff9ca7;font-weight:700;text-align:center}
button{width:100%;padding:18px;margin:7px 0;border:0;border-radius:12px;font-size:1rem;font-weight:700;color:#fff;background:#7157d9}
button:disabled{opacity:.45}
small{display:block;margin-top:14px;color:#bdb7c9;line-height:1.4}
</style>
</head>
<body>
<main>
<h1>Lushcon controller</h1>
<p>Choose a vibration pattern for the connected host phone.</p>
<p id="status" class="status">Opening private control session…</p>
<p id="edge-count" class="edge-count" aria-live="polite">EDGE used: 0 times</p>
<button data-command="20" disabled>20% — 5 seconds</button>
<button data-command="40" disabled>40% — 5 seconds</button>
<button data-command="60" disabled>60% — 5 seconds</button>
<button data-command="70" disabled>70% — 5 seconds</button>
<button data-command="wave" disabled>Wave — 8 seconds</button>
<small>This link works only while the host phone’s session is open. Anyone with this link can send a control command.</small>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://hqciviafxtfescteyvnn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_bvCxSUvRCzVTnpZfiHYshg_DTuRilpp";
const statusEl=document.querySelector("#status");
const edgeCountEl=document.querySelector("#edge-count");
const commandButtons=[...document.querySelectorAll("[data-command]")];
const session=new URLSearchParams(location.search).get("session");
const edgeKeyText=new URLSearchParams(location.search).get("edgeKey");
let edgeVerificationKey,edgeCount=0,client,channel,guestReady=false,guestRecoveryTimer,guestRecoveryPromise;

function status(text,colour="#ffca65"){
  statusEl.textContent=text;
  statusEl.style.color=colour;
}
function rawError(error){
  const name=error?.name||"Error";
  const message=error?.message||String(error)||"No error message supplied";
  return name+": "+message;
}
function fromBase64Url(text){
  const binary=atob(text.replaceAll("-","+").replaceAll("_","/").padEnd(Math.ceil(text.length/4)*4,"="));
  return Uint8Array.from(binary,character=>character.charCodeAt(0));
}
async function receiveEdgeCount(payload){
  const count=payload?.count;
  if(!edgeVerificationKey||!Number.isSafeInteger(count)||count<edgeCount||typeof payload?.signature!=="string") return;
  try{
    const message=new TextEncoder().encode("edge-count:"+session+":"+count);
    const valid=await crypto.subtle.verify(
      {name:"ECDSA",hash:"SHA-256"},
      edgeVerificationKey,
      fromBase64Url(payload.signature),
      message
    );
    if(!valid||count<edgeCount) return;
    edgeCount=count;
    edgeCountEl.textContent="EDGE used: "+edgeCount+(edgeCount===1 ? " time" : " times");
  }catch(error){
    console.warn("Ignored invalid EDGE count update",error);
  }
}
function guestChannelSubscribed(){
  const socketConnected=typeof client?.realtime?.isConnected!=="function"||client.realtime.isConnected();
  return guestReady&&channel?.state==="joined"&&socketConnected;
}
function guestChannelConnecting(){
  return channel?.state==="joining";
}
function scheduleGuestRecovery(){
  clearTimeout(guestRecoveryTimer);
  if(document.visibilityState!=="visible") return;
  guestRecoveryTimer=setTimeout(()=>recoverGuestSession(),1500);
}
async function subscribeGuestChannel(recovering=false){
  clearTimeout(guestRecoveryTimer);
  const previousChannel=channel;
  guestReady=false;
  channel=null;
  commandButtons.forEach(button=>button.disabled=true);
  if(previousChannel){
    try{await client.removeChannel(previousChannel)}catch(error){console.warn("Could not replace guest channel",error)}
  }
  if(recovering) status("Restoring controller session…");
  const activeChannel=client.channel("lushcon:"+session);
  channel=activeChannel;
  activeChannel
    .on("broadcast",{event:"edge-count"},payload=>receiveEdgeCount(payload?.payload))
    .subscribe(async(state,error)=>{
      if(channel!==activeChannel) return;
      if(state==="SUBSCRIBED"){
        try{
          if(!edgeVerificationKey){
            edgeVerificationKey=await crypto.subtle.importKey(
              "raw",fromBase64Url(edgeKeyText),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]
            );
          }
          if(channel!==activeChannel) return;
          guestReady=true;
          commandButtons.forEach(button=>button.disabled=false);
          status(recovering ? "Controller session restored." : "Connected — ready to send a command.","#7ee787");
          await activeChannel.send({type:"broadcast",event:"edge-count-request",payload:{}});
        }catch(keyError){
          guestReady=false;
          commandButtons.forEach(button=>button.disabled=true);
          status("This controller link has an invalid EDGE counter key.");
          console.error(keyError);
        }
      }else if(state==="CHANNEL_ERROR"||state==="TIMED_OUT"||state==="CLOSED"){
        guestReady=false;
        commandButtons.forEach(button=>button.disabled=true);
        status("Controller session disconnected — reconnecting…");
        console.error("Supabase channel status:",state,error);
        scheduleGuestRecovery();
      }
    });
}
async function recoverGuestSession(){
  if(guestChannelSubscribed()||guestChannelConnecting()) return;
  if(guestRecoveryPromise) return guestRecoveryPromise;
  guestRecoveryPromise=subscribeGuestChannel(true).finally(()=>{guestRecoveryPromise=null});
  return guestRecoveryPromise;
}
if(!/^[a-f0-9]{48}$/.test(session||"")||!/^[A-Za-z0-9_-]+$/.test(edgeKeyText||"")){
  status("This controller link is missing or invalid.");
}else if(!window.supabase){
  status("The realtime library did not load. Check your internet connection and reload.");
}else{
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
    auth:{persistSession:false,autoRefreshToken:false}
  });
  subscribeGuestChannel(false);

  commandButtons.forEach(button=>button.addEventListener("click",async()=>{
    const command=button.dataset.command;
    commandButtons.forEach(item=>item.disabled=true);
    status("Sending "+(command==="wave" ? "wave" : command+"%")+" command…");
    try{
      const result=await channel.send({
        type:"broadcast",
        event:"control-command",
        payload:{command}
      });
      if(result!=="ok") throw new Error("Broadcast result: "+String(result));
      status("Command sent.","#7ee787");
    }catch(error){
      console.error(error);
      status("Could not send command: "+rawError(error));
    }finally{
      commandButtons.forEach(item=>item.disabled=!guestReady);
    }
  }));

  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="visible"&&!guestChannelSubscribed()&&!guestChannelConnecting()) recoverGuestSession();
  });
  addEventListener("pageshow",()=>{if(!guestChannelSubscribed()&&!guestChannelConnecting()) recoverGuestSession()});
  addEventListener("online",()=>{if(document.visibilityState==="visible"&&!guestChannelSubscribed()&&!guestChannelConnecting()) recoverGuestSession()});
}
</script>
</body>
</html>
