<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lush Mini Bluetooth Test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17151d;color:#fff}
main{width:min(92vw,420px);box-sizing:border-box;padding:28px;border-radius:20px;background:#27232f;box-shadow:0 12px 40px #0006}
h1{font-size:1.35rem;margin:0 0 22px}
button{width:100%;padding:15px;margin:7px 0;border:0;border-radius:12px;font-size:1rem;font-weight:700;color:#fff;background:#7157d9}
button:disabled{opacity:.45}
#stop{background:#b33d55}
.status{margin:0 0 18px;padding:12px;border-radius:10px;background:#191720;color:#ffca65;line-height:1.35;overflow-wrap:anywhere}
small{display:block;margin-top:14px;color:#bdb7c9;line-height:1.4}
</style>
</head>
<body>
<main>
<h1>Lovense Lush Mini — local Bluetooth test</h1>
<p id="status" class="status">Disconnected</p>
<button id="connect">Connect Device</button>
<button id="vibrate" disabled>20% vibration (max 5 seconds)</button>
<button id="stop" disabled>Stop</button>
<small>Use Chrome on Android over HTTPS. Turn the Lush Mini on and keep it nearby. No Intiface Central or backend is required for this local test.</small>
</main>
<script>
const statusEl=document.querySelector("#status");
const connectBtn=document.querySelector("#connect");
const vibrateBtn=document.querySelector("#vibrate");
const stopBtn=document.querySelector("#stop");

const STATIC_LOVENSE_GATT=[
  {
    service:"0000fff0-0000-1000-8000-00805f9b34fb",
    tx:"0000fff2-0000-1000-8000-00805f9b34fb"
  },
  {
    service:"6e400001-b5a3-f393-e0a9-e50e24dcca9e",
    tx:"6e400002-b5a3-f393-e0a9-e50e24dcca9e"
  }
];

// Buttplug's documented Web Bluetooth enumeration: 16 valid Y values
// for each documented X/Z form, producing 32 third-generation pairs.
const THIRD_GENERATION_LOVENSE_GATT=[..."0123456789abcdef"].flatMap(y=>
  [["4",y,"3"],["5",y,"4"]].map(([x,hexY,z])=>({
    service:`${x}${hexY}300001-002${z}-4bd4-bbd5-a6920e4c5653`,
    tx:`${x}${hexY}300002-002${z}-4bd4-bbd5-a6920e4c5653`
  }))
);

const LOVENSE_GATT=[...STATIC_LOVENSE_GATT,...THIRD_GENERATION_LOVENSE_GATT];
const SERVICES=LOVENSE_GATT.map(profile=>profile.service);

let server, tx, device, stopTimer;
const encoder=new TextEncoder();

function status(text,colour="#ffca65"){
  statusEl.textContent=text;
  statusEl.style.color=colour;
}
function ready(yes){
  vibrateBtn.disabled=!yes;
  stopBtn.disabled=!yes;
}
function errorText(error){
  if(error?.name==="NotFoundError") return "No device selected (Bluetooth picker cancelled).";
  if(error?.name==="SecurityError") return "Bluetooth is blocked. Use Chrome over HTTPS and press Connect directly.";
  if(error?.name==="NetworkError") return "Bluetooth connection failed. Make sure the Lush Mini is on, nearby, and not connected to another app.";
  return error?.message||String(error)||"Unknown Bluetooth error.";
}
async function write(command){
  if(!tx) throw new Error("No Lovense write characteristic is connected.");
  const data=encoder.encode(command);
  if(tx.properties.writeWithoutResponse) await tx.writeValueWithoutResponse(data);
  else await tx.writeValue(data);
}
async function findCharacteristic(){
  for(const profile of LOVENSE_GATT){
    try{
      const service=await server.getPrimaryService(profile.service);
      const characteristic=await service.getCharacteristic(profile.tx);
      if(characteristic.properties.write||characteristic.properties.writeWithoutResponse) return characteristic;
    }catch(_){}
  }
  throw new Error("The device connected, but its Lovense BLE service is not one of the supported fixed protocol profiles.");
}

connectBtn.addEventListener("click",async()=>{
  if(!("bluetooth" in navigator)){
    status("Web Bluetooth is unavailable in this browser. Use Chrome on Android.");
    return;
  }
  connectBtn.disabled=true;
  status("Opening Bluetooth device picker…");
  try{
    device=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:"LVS-"},{namePrefix:"LOVE-"}],
      optionalServices:SERVICES
    });
    device.addEventListener("gattserverdisconnected",()=>{
      tx=null; server=null; ready(false); connectBtn.disabled=false; status("Disconnected");
    });
    status("Connecting to "+(device.name||"Lovense device")+"…");
    server=await device.gatt.connect();
    tx=await findCharacteristic();
    await write("DeviceType;");
    ready(true);
    status("Connected: "+(device.name||"Lovense device"),"#7ee787");
  }catch(error){
    console.error(error);
    ready(false);
    connectBtn.disabled=false;
    status(errorText(error));
  }
});

vibrateBtn.addEventListener("click",async()=>{
  try{
    await write("Vibrate:4;");
    clearTimeout(stopTimer);
    stopTimer=setTimeout(()=>write("Vibrate:0;").catch(()=>{}),5000);
    status("Vibrating at 20%","#7ee787");
  }catch(error){status("Vibration failed: "+errorText(error))}
});

stopBtn.addEventListener("click",async()=>{
  clearTimeout(stopTimer);
  try{await write("Vibrate:0;");status("Connected — stopped","#7ee787")}
  catch(error){status("Stop failed: "+errorText(error))}
});
</script>
</body>
</html>
