  <title>CTMP · Private control</title>
  <script type="module">
    const version = '20261106-v24';
    const classic = new URLSearchParams(location.search).has('classic');
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = `${classic ? '/app/styles.css' : '/app/simple-player.css'}?v=${version}`;
    document.head.append(css);
    await import(`${classic ? '/app/main.js' : '/app/simple-player.js'}?v=${version}`);
  </script>
</head>
<body>
  <div id="app"><main class="loading-shell"><span class="brand-mark">C</span><h1>CTMP</h1><p>Opening your control panel…</p><noscript>This control panel needs JavaScript enabled.</noscript></main></div>

</html>
