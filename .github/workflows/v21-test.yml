name: V2.1 branch tests
on:
  push:
    branches:
      - feature/v2-1-recovery-20261104
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs tests/*.test.cjs
