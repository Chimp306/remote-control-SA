[functions.guest-access]
# The resolver accepts a private guest token without a Supabase login.
# All other actions explicitly verify the user JWT and host allowlist.
verify_jwt = false

[functions.ctmp-control]
# Custom opaque owner/guest capabilities are verified in the function body.
# A publishable project key is never treated as a user credential.
verify_jwt = false

[functions.grok-control]
# The fresh project uses publishable and secret keys, which are not JWTs.
# verify_jwt only understands legacy JWTs, so the function checks the owner
# access token itself. The platform secret key stays in the function environment.
verify_jwt = false

